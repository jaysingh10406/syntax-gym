</text><text x="170" y="79" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Learn</text><text x="170" y="94" fill="#4f5d75" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">lecture + the shape</text><rect x="346" y="40" width="220" height="66" rx="2" fill="#f5f5f5"/><rect x="346" y="40" width="220" height="66" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/><rect x="354" y="46" width="34" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45" stroke-width="0.8"/><text x="371" y="55" fill="#4f5d75" font-size="7" font-family="Geist Mono, monospace" text-anchor="middle" letter-spacing="0.1em">SPOT</text><text x="456" y="79" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Choose</text><text x="456" y="94" fill="#4f5d75" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">4 options, 1 right</text><rect x="632" y="40" width="220" height="66" rx="2" fill="#f5f5f5"/><rect x="632" y="40" width="220" height="66" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><rect x="640" y="46" width="34" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.45" stroke-width="0.8"/><text x="657" y="55" fill="#bf4520" font-size="7" font-family="Geist Mono, monospace" text-anchor="middle" letter-spacing="0.1em">RECALL</text><text x="742" y="79" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Write</text><text x="742" y="94" fill="#4f5d75" font-size="9" font-family="Geist Mono, monospace" text-anchor="middle">from memory, graded</text><line x1="30" y1="174" x2="882" y2="174" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="30" y="192" fill="#5a6580" font-size="8" font-family="Geist Mono, monospace" letter-spacing="0.16em">LEGEND</text><rect x="108" y="184" width="14" height="8" rx="1" fill="rgba(191,69,32,0.08)" stroke="#bf4520" st